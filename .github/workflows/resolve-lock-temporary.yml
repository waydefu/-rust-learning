name: 暫時解析 scraper 依賴鎖檔
on:
  pull_request:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Resolve with pinned toolchain
        run: |
          cargo metadata --manifest-path tools/Cargo.toml --format-version 1 > /dev/null
          echo 'LOCKFILE_START'
          cat tools/Cargo.lock
          echo 'LOCKFILE_END'
          cargo test --workspace --locked --manifest-path tools/Cargo.toml
          cargo clippy --workspace --locked --manifest-path tools/Cargo.toml --all-targets -- -D warnings
          if grep -q '^name = "fxhash"$' tools/Cargo.lock; then
            echo 'fxhash still present'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resolved-workspace-lock
          path: tools/Cargo.lock

name: 驗證與發布網站

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 教材與網站驗證
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REQUIRE_NATIVE_MARKDOWN: '1'
      VERIFY_SITE_WRITE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: rustup show
      - run: cargo test --locked --manifest-path tools/lesson-check/Cargo.toml
      - run: cargo test --locked --manifest-path tools/site-tools/Cargo.toml
      - run: cargo test --locked --manifest-path tools/site-render/Cargo.toml
      - name: Rust-anything 行為錄製與重播
        shell: bash
        run: bash scripts/migration/replay-site-write.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-replay
          path: .migration-evidence/
          include-hidden-files: true
          if-no-files-found: ignore
      - run: npm run build && npm run check
      - run: npm run check:rust
      - run: npx playwright install --with-deps chromium
      - run: npm run build && npm run check && npm run test:browser
        env:
          BASE_PATH: /-rust-learning/
      - name: 驗證 Rust 本機預覽伺服器
        env:
          BASE_PATH: /-rust-learning/
          HOST: 127.0.0.1
          PORT: 4173
        shell: bash
        run: |
          cargo build --locked --manifest-path tools/site-tools/Cargo.toml --bin site-preview
          tools/site-tools/target/debug/site-preview dist &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT
          url="http://127.0.0.1:4173/-rust-learning"
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 1 --max-time 10 "$url/" -o /tmp/rust-preview-home.html
          grep -Fq 'Rust 學習工坊' /tmp/rust-preview-home.html
          curl --fail --silent --show-error --max-time 10 "$url/chapters/ownership/" -o /tmp/rust-preview-lesson.html
          grep -Fq 'ownership-lab' /tmp/rust-preview-lesson.html
          curl --fail --silent --show-error --max-time 10 "$url/assets/search-index.json" -o /tmp/rust-preview-search.json
          cmp dist/assets/search-index.json /tmp/rust-preview-search.json
          curl --fail --silent --show-error --head --max-time 10 "$url/assets/site.css" | grep -iF 'Content-Type: text/css'
          test "$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "$url/chapters/ownership")" = 308
          test "$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "$url/not-here/")" = 404
          test "$(curl --path-as-is --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "$url/%2e%2e/README.md")" = 404

  build_pages:
    name: 建置與上傳 Pages 產物
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REQUIRE_NATIVE_MARKDOWN: '1'
    permissions:
      contents: read
      pages: read
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run build && npm run check
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: 記錄發布版本與產物名稱
        id: package
        run: |
          printf '%s\n' "$GITHUB_SHA" > dist/build-revision.txt
          printf 'artifact_name=github-pages-%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        id: upload
        with:
          path: dist
          name: ${{ steps.package.outputs.artifact_name }}

  # Upload and deploy must be in different jobs: the public REST artifact
  # listing can be current while the deploy-pages internal listing is stale.
  # See actions/deploy-pages#451. A failed deploy-only rerun must use the
  # successful build job's output, not the rerun's GITHUB_RUN_ATTEMPT.
  deploy:
    name: 發布 GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build_pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 等待 Pages 產物可被 API 查到
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build_pages.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.build_pages.outputs.artifact_name }}
        shell: bash
        run: |
          if [[ ! "$ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Upload did not return a valid artifact ID"
            exit 1
          fi
          for attempt in $(seq 1 15); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" |
              jq -e --arg id "$ARTIFACT_ID" --arg name "$ARTIFACT_NAME" '
                (.artifacts | map(select(.name == $name and .expired == false))) as $matches
                | ($matches | length) == 1 and ($matches[0].id | tostring) == $id
              ' > /dev/null; then
              echo "Pages artifact $ARTIFACT_ID is visible (attempt $attempt)"
              exit 0
            fi
            echo "Waiting for Pages artifact metadata (attempt $attempt/15)"
            if (( attempt < 15 )); then sleep 4; fi
          done
          echo "::error::Pages artifact $ARTIFACT_ID is still not visible; retry the workflow"
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: ${{ needs.build_pages.outputs.artifact_name }}
      - name: 驗證線上入口與章節
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          endpoint="${PAGE_URL%/}"
          # A successful HTTP response may still be the previous deployment.
          for attempt in $(seq 1 12); do
            revision="$(curl --fail --silent --show-error --max-time 10 "$endpoint/build-revision.txt?v=$GITHUB_SHA" || true)"
            if [ "$revision" = "$GITHUB_SHA" ]; then break; fi
            echo "Waiting for published revision (attempt $attempt/12)"
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          if [ "$revision" != "$GITHUB_SHA" ]; then
            echo "::error::Published revision does not match $GITHUB_SHA"
            exit 1
          fi
          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 20 "$endpoint/" -o /tmp/rust-home.html
          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 20 "$endpoint/chapters/ownership/" -o /tmp/rust-ownership.html
          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 20 "$endpoint/assets/site.css" -o /tmp/rust-site.css
          grep -Fq 'Rust 學習工坊' /tmp/rust-home.html
          grep -Fq 'ownership-lab' /tmp/rust-ownership.html
          for kind in context analogy walkthrough warning practice; do
            grep -Fq "data-callout=\"$kind\"" /tmp/rust-ownership.html
          done
          grep -Fq '.lesson-callout' /tmp/rust-site.css
          test -s /tmp/rust-site.css
          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 20 "$endpoint/build-render-report.json" -o /tmp/rust-render-report.json
          jq -e '.layout == "rust" and .pages == 34 and (.markdown | length) == 31 and all(.markdown[]; .renderer == "rust")' /tmp/rust-render-report.json

<a class="chapter-card{{featuredClass}}" href="{{base}}{{path}}/" data-card-chapter="{{id}}">
    <div class="card-top"><span class="card-number stage-{{stage}}">{{id}}</span>{{featuredTag}}<span class="card-done" hidden>{{check}} 已完成</span></div>
    <h3>{{title}}</h3><p>{{description}}</p>
    <span class="card-link">閱讀章節 {{chevron}}</span>
  </a>
